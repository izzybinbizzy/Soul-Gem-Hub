; ============================================================================
;  Illuminated - Soul Gem Hub - Advanced Settings (file version 1)
; ============================================================================
;  Fine values the in-game menu does not show. The game reads this file once,
;  when it starts.
;
;  TO CHANGE A VALUE: change the number after the = and save, then start the
;  game. The note above each value says what it does; its default and allowed
;  range are written beside it. A value outside its range is held at the
;  nearest end.
;
;  TO RESET A VALUE: delete its line, or the whole file, and the default
;  comes back - unless your Custom file (below) sets it: take the line out
;  there too.
;
;  TO KEEP YOUR CHANGES THROUGH UPDATES: an update replaces this file. Put
;  only the lines you change, under their [Section], in a file of their own
;  beside this one:
;    Illuminated - Soul Gem Hub - Advanced Settings - Custom.ini
;  Its lines win over this file, and no update touches it.
;
;  The menu's own settings (its sliders and switches) stay in the menu.
; ============================================================================
;
;  CONTENTS
;    1. Brightness and Reach
;    2. Flicker
;    3. Vanilla and ENB
;    4. Performance
;
;  MOST PEOPLE ONLY CHANGE THESE
;    StarBrightness  in [Brightness and Reach]
;    PulseSwing      in [Flicker]
;    MaxLitGems      in [Performance]
;
; ============================================================================

; ----------------------------------------------------------------------------
;  1. BRIGHTNESS AND REACH
;  How bright the lights are and how far they reach, beyond the menu's sliders.
; ----------------------------------------------------------------------------
[Brightness and Reach]

; Brightness of petty soul gems' lights, on top of the menu's Brightness: 1 as made.
PettyBrightness     = 1  ; default 1 - range 0.25 to 4

; Brightness of lesser soul gems' lights: 1 as made.
LesserBrightness    = 1  ; default 1 - range 0.25 to 4

; Brightness of common soul gems' lights: 1 as made.
CommonBrightness    = 1  ; default 1 - range 0.25 to 4

; Brightness of greater soul gems' lights: 1 as made.
GreaterBrightness   = 1  ; default 1 - range 0.25 to 4

; Brightness of grand soul gems' lights: 1 as made.
GrandBrightness     = 1  ; default 1 - range 0.25 to 4

; Brightness of black soul gems' lights: 1 as made.
BlackBrightness     = 1  ; default 1 - range 0.25 to 4

; Brightness of the named quest gems' and the Paragons' lights: 1 as made.
NamedGemBrightness  = 1  ; default 1 - range 0.25 to 4

; Brightness of Azura's Star and the Black Star, on top of the menu's Stars slider: 1 as made.
StarBrightness      = 1  ; default 1 - range 0.25 to 4

; Brightness of the Soul Cairn's gem bowl and chunks: 1 as made.
SoulCairnBrightness = 1  ; default 1 - range 0.25 to 4

; ----------------------------------------------------------------------------
;  2. FLICKER
;  How lights flicker and pulse.
; ----------------------------------------------------------------------------
[Flicker]

; How much a gem's light breathes either side of its strength: 0.1 is 10 percent, 0 steady.
PulseSwing   = 0.1  ; default 0.1 - range 0 to 0.5

; How many seconds one breath of the soft pulse takes.
PulseSeconds = 4.5  ; default 4.5 - range 1 to 20

; ----------------------------------------------------------------------------
;  3. VANILLA AND ENB
;  Values used only without Community Shaders.
; ----------------------------------------------------------------------------
[Vanilla and ENB]

; How much brighter every gem's light is drawn on Vanilla lighting, where it reads darker.
VanillaBoost = 1.25  ; default 1.25 - range 0.5 to 3

; ----------------------------------------------------------------------------
;  4. PERFORMANCE
;  Limits that keep big fights smooth.
; ----------------------------------------------------------------------------
[Performance]

; How many soul gems nearest you get a light at once.
MaxLitGems = 24  ; default 24 - range 1 to 64
